<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan de Vuelo OACI - Aeroclub</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --primary: #004b87;
      --accent: #0076d6;
      --bg: #f4f7f9;
      --card: #ffffff;
      --text: #2c3e50;
      --border: #dcdfe6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.4rem;
      margin: 0 0 5px 0;
      color: var(--primary);
    }
    .utc-clock {
      font-size: 0.9rem;
      font-weight: bold;
      color: #e67e22;
      background: #fef5e7;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
    }
    .step-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
      text-transform: uppercase;
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-next { background: var(--accent); color: #fff; }
    .btn-prev { background: #e0e0e0; color: #333; }
    .btn-pdf { background: #27ae60; color: #fff; width: 100%; font-size: 1rem; padding: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>✈️ Plan de Vuelo OACI Oficial</h1>
    <div class="utc-clock">HORA UTC: <span id="utcTime">--:--:--</span></div>
  </div>

  <form id="fplForm">
    <!-- PASO 1: Matrícula y Datos Fijos -->
    <div class="step active" id="step1">
      <div class="step-title">Paso 1 de 5: Aeronave y Matrícula</div>
      <div class="form-group">
        <label>7. Identificación de la Aeronave (Callsign):</label>
        <input type="text" id="callsign" placeholder="LV-ABC" required>
      </div>
      <div class="form-group">
        <label>9. Tipo de Aeronave (OACI):</label>
        <input type="text" id="acType" placeholder="C172" required>
      </div>
      <div class="form-group">
        <label>9. Categoría de Estela Turbulenta:</label>
        <select id="wake">
          <option value="L">L - Ligera (<= 7,000 kg)</option>
          <option value="M">M - Media (> 7,000 kg)</option>
          <option value="H">H - Pesada</option>
        </select>
      </div>
    </div>

    <!-- PASO 2: Reglas y Equipamiento -->
    <div class="step" id="step2">
      <div class="step-title">Paso 2 de 5: Reglas y Equipamiento (Casilleros 8 y 10)</div>
      <div class="form-group">
        <label>8. Reglas de Vuelo:</label>
        <select id="rules">
          <option value="V">V - VFR</option>
          <option value="I">I - IFR</option>
          <option value="Y">Y - IFR primero</option>
          <option value="Z">Z - VFR primero</option>
        </select>
      </div>
      <div class="form-group">
        <label>8. Tipo de Vuelo:</label>
        <select id="flightType">
          <option value="G">G - Aviación General</option>
          <option value="S">S - Servicio Regular</option>
          <option value="N">N - No Regular</option>
          <option value="M">M - Militar</option>
          <option value="X">X - Otros</option>
        </select>
      </div>
      <div class="form-group">
        <label>10a. Equipo COM/NAV/Aproximación:</label>
        <input type="text" id="eqA" value="S/C">
      </div>
      <div class="form-group">
        <label>10b. Equipo de Vigilancia (Transponder):</label>
        <input type="text" id="eqB" value="C">
      </div>
    </div>

    <!-- PASO 3: Salida y Ruta -->
    <div class="step" id="step3">
      <div class="step-title">Paso 3 de 5: Salida y Ruta (Casilleros 13 y 15)</div>
      <div class="form-group">
        <label>13. Aeródromo de Salida (ICAO/OACI):</label>
        <input type="text" id="dep" placeholder="SAVC" required>
      </div>
      <div class="form-group">
        <label>13. Hora prevista de fuera calzos (EOBT UTC - HHMM):</label>
        <input type="text" id="depTime" placeholder="1400" maxlength="4" required>
      </div>
      <div class="form-group">
        <label>15. Velocidad de Crucero (ej. N0110):</label>
        <input type="text" id="speed" value="N0110">
      </div>
      <div class="form-group">
        <label>15. Nivel de Crucero (ej. A045, F090, VFR):</label>
        <input type="text" id="level" value="VFR">
      </div>
      <div class="form-group">
        <label>Enlace de SkyVector (Extracción automática):</label>
        <input type="text" id="skyvector" placeholder="https://skyvector.com/?fpl=..." oninput="parseSkyVector()">
      </div>
      <div class="form-group">
        <label>15. Ruta completada:</label>
        <textarea id="route">DCT</textarea>
      </div>
    </div>

    <!-- PASO 4: Destino y Casillero 18 -->
    <div class="step" id="step4">
      <div class="step-title">Paso 4 de 5: Destino y Otros Datos (Casilleros 16 y 18)</div>
      <div class="form-group">
        <label>16. Aeródromo de Destino (ICAO/OACI):</label>
        <input type="text" id="dest" placeholder="SAVT" required>
      </div>
      <div class="form-group">
        <label>16. Duración Total Prevista (EET - HHMM):</label>
        <input type="text" id="eet" placeholder="0045" maxlength="4" required>
      </div>
      <div class="form-group">
        <label>16. Aeródromo de Alternativa:</label>
        <input type="text" id="altn" placeholder="SACR">
      </div>
      <div class="form-group">
        <label>18. Otros Datos (DOF/, RMK/, NAV/, etc.):</label>
        <input type="text" id="other" value="RMK/AEROCLUB">
      </div>
    </div>

    <!-- PASO 5: Información Suplementaria -->
    <div class="step" id="step5">
      <div class="step-title">Paso 5 de 5: Información Suplementaria (Casillero 19)</div>
      <div class="form-group">
        <label>E/ Autonomía (HHMM):</label>
        <input type="text" id="endurance" placeholder="0430" maxlength="4" required>
      </div>
      <div class="form-group">
        <label>P/ Personas a Bordo (POB):</label>
        <input type="number" id="pob" value="2" min="1">
      </div>
      <div class="form-group">
        <label>A/ Color y Marcas de la Aeronave:</label>
        <input type="text" id="color" placeholder="BLANCO CON FRANJAS AZULES">
      </div>
      <div class="form-group">
        <label>C/ Nombre del Piloto al Mando:</label>
        <input type="text" id="pic" placeholder="PILOTO AL MANDO">
      </div>
      <button type="button" class="btn-pdf" onclick="generateOfficialPDF()">📄 DESCARGAR FORMULARIO OFICIAL OACI (PDF)</button>
    </div>

    <div class="nav-buttons">
      <button type="button" class="btn-prev" id="prevBtn" onclick="changeStep(-1)" style="display:none;">Anterior</button>
      <button type="button" class="btn-next" id="nextBtn" onclick="changeStep(1)">Siguiente</button>
    </div>
  </form>
</div>

<script>
  let currentStep = 1;

  function updateClock() {
    const now = new Date();
    const h = String(now.getUTCHours()).padStart(2, '0');
    const m = String(now.getUTCMinutes()).padStart(2, '0');
    const s = String(now.getUTCSeconds()).padStart(2, '0');
    document.getElementById('utcTime').textContent = `${h}:${m}:${s} UTC`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  function changeStep(dir) {
    document.getElementById(`step${currentStep}`).classList.remove('active');
    currentStep += dir;
    document.getElementById(`step${currentStep}`).classList.add('active');

    document.getElementById('prevBtn').style.display = currentStep === 1 ? 'none' : 'block';
    document.getElementById('nextBtn').style.display = currentStep === 5 ? 'none' : 'block';
  }

  function parseSkyVector() {
    const url = document.getElementById('skyvector').value;
    if (url.includes('fpl=')) {
      const match = url.match(/fpl=([^&]+)/);
      if (match && match[1]) {
        const routeClean = decodeURIComponent(match[1]).replace(/\+/g, ' ');
        document.getElementById('route').value = routeClean.toUpperCase();
      }
    }
  }

  // Generador con Formato de Casilleros Oficiales OACI
  function generateOfficialPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');

    doc.setLineWidth(0.3);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);

    // ENCABEZADO
    doc.text("MODELO DE FORMULARIO DE PLAN DE VUELO OACI", 105, 12, { align: "center" });

    // CASILLERO 3: DESTINATARIOS
    doc.rect(10, 16, 190, 10);
    doc.setFontSize(7);
    doc.text("3. DESTINATARIOS", 12, 19);
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("FF / ARO / AIS / TWR", 12, 24);

    // FILA 1: CAMPOS 7, 8, 9, 10
    doc.rect(10, 28, 45, 14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("7. IDENTIFICACIÓN AERONAVE", 12, 31);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(document.getElementById('callsign').value.toUpperCase(), 12, 38);

    doc.rect(55, 28, 30, 14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("8. REGLAS / TIPO", 57, 31);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(`${document.getElementById('rules').value} / ${document.getElementById('flightType').value}`, 57, 38);

    doc.rect(85, 28, 55, 14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("9. TIPO AERONAVE / ESTELA", 87, 31);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(`${document.getElementById('acType').value.toUpperCase()} / ${document.getElementById('wake').value}`, 87, 38);

    doc.rect(140, 28, 60, 14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("10. EQUIPO (a/b)", 142, 31);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(`${document.getElementById('eqA').value.toUpperCase()} / ${document.getElementById('eqB').value.toUpperCase()}`, 142, 38);

    // FILA 2: CAMPO 13
    doc.rect(10, 44, 190, 12);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("13. AERÓDROMO DE SALIDA Y HORA (EOBT)", 12, 47);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.text(`${document.getElementById('dep').value.toUpperCase()}  -  EOBT: ${document.getElementById('depTime').value} UTC`, 12, 53);

    // FILA 3: CAMPO 15 (Ruta)
    doc.rect(10, 58, 190, 25);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("15. VELOCIDAD, NIVEL Y RUTA", 12, 61);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text(`VELOCIDAD: ${document.getElementById('speed').value.toUpperCase()}    NIVEL: ${document.getElementById('level').value.toUpperCase()}`, 12, 67);
    doc.setFontSize(8);
    const splitRoute = doc.splitTextToSize(`RUTA: ${document.getElementById('route').value.toUpperCase()}`, 180);
    doc.text(splitRoute, 12, 73);

    // FILA 4: CAMPO 16 (Destino)
    doc.rect(10, 85, 190, 14);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("16. AERÓDROMO DESTINO, EET Y ALTERNATIVAS", 12, 88);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text(`DESTINO: ${document.getElementById('dest').value.toUpperCase()}   EET: ${document.getElementById('eet').value}   ALTN: ${document.getElementById('altn').value.toUpperCase()}`, 12, 95);

    // FILA 5: CAMPO 18 (Otros datos)
    doc.rect(10, 101, 190, 20);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7);
    doc.text("18. OTROS DATOS", 12, 104);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    const splitOther = doc.splitTextToSize(document.getElementById('other').value.toUpperCase(), 180);
    doc.text(splitOther, 12, 110);

    // FILA 6: CAMPO 19 (Información Suplementaria)
    doc.rect(10, 123, 190, 35);
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    doc.text("19. INFORMACIÓN SUPLEMENTARIA", 12, 127);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    doc.text(`E/ AUTONOMÍA: ${document.getElementById('endurance').value}    P/ POB: ${document.getElementById('pob').value}`, 12, 134);
    doc.text(`A/ COLOR Y MARCAS: ${document.getElementById('color').value.toUpperCase()}`, 12, 141);
    doc.text(`C/ PILOTO AL MANDO: ${document.getElementById('pic').value.toUpperCase()}`, 12, 148);

    const filename = `FPL_OACI_${document.getElementById('callsign').value.toUpperCase()}_${document.getElementById('dep').value.toUpperCase()}.pdf`;
    doc.save(filename);
  }
</script>
</body>
</html>
